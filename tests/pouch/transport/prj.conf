CONFIG_ZTEST=y
CONFIG_POUCH=y
CONFIG_POUCH_TRANSPORT_SAR=y
CONFIG_POUCH_ENCRYPTION_MOCK=y
# Some of the tests require more threads waiting on the same mutex than the basic wait queue can handle
CONFIG_WAITQ_SCALABLE=y
# enough to exhaust the max stream ID:
CONFIG_POUCH_BLOCK_COUNT=128
# Hold as many fragments as the largest receiver window, so the tests aren't capped by the sender:
CONFIG_POUCH_TRANSPORT_SAR_TX_WINDOW=127
# The receiver repeats its ACK after this long without fragments, which the sender relies on to
# recover lost fragments at the end of a transfer. Keep it short, so the tests run quickly:
CONFIG_POUCH_TRANSPORT_ACK_TIMEOUT_MS=20
