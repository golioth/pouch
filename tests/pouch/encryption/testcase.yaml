common:
  build_only: true
  platform_allow:
    - nrf52840dk/nrf52840
    - nrf54lm20dk/nrf54lm20a/cpuapp
tests:
  pouch.encryption.chacha:
    extra_configs:
      - CONFIG_POUCH_ENCRYPTION_CHACHA20_POLY1305=y
  pouch.encryption.aesgcm:
    extra_configs:
      - CONFIG_POUCH_ENCRYPTION_AES_GCM=y
