[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "pytest-pouch"
version = "0.1.0"
dependencies = [
    "pytest",
    "anyio[trio]",
    "pyserial",
]
classifiers = [
    "Framework :: Pytest",
]

[project.entry-points.pytest11]
pouch = "pytest_pouch.plugin"
