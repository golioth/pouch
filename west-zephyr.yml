manifest:
  version: 0.8
  group-filter: [+babblesim]

  projects:
    # Signs artifact URLs on the device, so the host can fetch an image the
    # device is entitled to without holding any credential of its own. Used by
    # the rpmsg_device example; see examples/zephyr/rpmsg_device/README.md.
    - name: signy
      path: modules/lib/signy
      revision: v0.2.0
      url: https://github.com/golioth/signy.git

    - name: zephyr
      revision: v4.4.0
      url: https://github.com/zephyrproject-rtos/zephyr
      west-commands: scripts/west-commands.yml
      import:
        name-allowlist:
          - zephyr
          - cmsis_6
          - hal_nordic
          - hal_nxp
          - libmetal
          - open-amp
          - mbedtls
          - mcuboot
          - nrf_hw_models
          - picolibc
          - segger
          - tf-psa-crypto
          - tfm-mcuboot
          - trusted-firmware-m
          - littlefs
          - zcbor
        path-allowlist:
          - "tools/bsim"
          - "tools/bsim/*"
          - "tools/bsim/*/*"

  self:
    path: pouch
